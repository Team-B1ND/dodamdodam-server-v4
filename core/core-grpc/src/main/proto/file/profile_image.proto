syntax = "proto3";

package file;

option java_multiple_files = true;
option java_package = "com.b1nd.dodamdodam.grpc.file";

service ProfileImageService {
  rpc ValidateProfileImage (ValidateProfileImageRequest)
      returns (ValidateProfileImageResponse);
}

message ValidateProfileImageRequest {
  string url = 1;
}

message ValidateProfileImageResponse {
  bool valid = 1;
}
