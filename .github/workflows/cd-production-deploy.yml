name: CD Production - Deploy in batches

on:
  workflow_call:
    inputs:
      services:
        required: true
        type: string
      tag:
        required: true
        type: string
      k8s_repository:
        required: true
        type: string
    secrets:
      K8S_REPO_TOKEN:
        required: true

jobs:
  dispatch:
    environment: production
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.K8S_REPO_TOKEN }}
      K8S_REPOSITORY: ${{ inputs.k8s_repository }}
      SERVICES: ${{ inputs.services }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Dispatch and wait two services at a time
        run: bash .github/scripts/production/deploy/dispatch-batches.sh
