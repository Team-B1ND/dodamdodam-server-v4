name: CD Production - Build and publish

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

env:
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/dodam

jobs:
  build-and-publish:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: inputs.service != 'notification'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Gradle
        if: inputs.service != 'notification'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}-${{ inputs.service }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build Spring service
        if: inputs.service != 'notification'
        env:
          SERVICE: ${{ inputs.service }}
        run: bash .github/scripts/production/build/spring.sh

      - name: Set up Node.js
        if: inputs.service == 'notification'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/service-notification/package-lock.json

      - name: Build Node service
        if: inputs.service == 'notification'
        run: bash .github/scripts/production/build/notification.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve Dockerfile
        id: dockerfile
        if: inputs.service != 'notification'
        env:
          SERVICE: ${{ inputs.service }}
        run: bash .github/scripts/production/build/resolve-dockerfile.sh

      - name: Build and push Spring image
        if: inputs.service != 'notification'
        uses: docker/build-push-action@v6
        with:
          context: services/service-${{ inputs.service }}/build/libs
          file: ${{ steps.dockerfile.outputs.file }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ inputs.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ inputs.service }}:${{ inputs.tag }}
          build-args: JAR_FILE=service-${{ inputs.service }}.jar

      - name: Build and push Node image
        if: inputs.service == 'notification'
        uses: docker/build-push-action@v6
        with:
          context: services/service-notification
          file: services/service-notification/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-notification:latest
            ${{ env.IMAGE_PREFIX }}-notification:${{ inputs.tag }}
