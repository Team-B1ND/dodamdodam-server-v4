name: "CD Production"

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/dodam
  SPRING_SERVICES: "gateway auth user wakeup-song inapp file neis out-sleeping nightstudy oauth"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      spring_services: ${{ steps.changes.outputs.spring_services }}
      deploy_services: ${{ steps.changes.outputs.deploy_services }}
      notification: ${{ steps.changes.outputs.notification }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        run: |
          ALL_SPRING="$SPRING_SERVICES"

          # 직전 태그 기준으로 변경 파일 목록 계산 (첫 태그면 전체 빌드)
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, building everything"
            CHANGED_FILES="__ALL__"
          else
            echo "Comparing against $PREV_TAG"
            CHANGED_FILES=$(git diff --name-only "$PREV_TAG"..HEAD)
          fi

          # 공용 코드/빌드 설정이 바뀌면 전체 빌드
          if [ "$CHANGED_FILES" = "__ALL__" ] || echo "$CHANGED_FILES" | grep -qE '^(core/|builds/|gradle/|\.github/workflows/|build\.gradle|settings\.gradle)'; then
            SPRING_CHANGED="$ALL_SPRING"
            NOTIFICATION="true"
          else
            SPRING_CHANGED=""
            for svc in $ALL_SPRING; do
              if echo "$CHANGED_FILES" | grep -q "^services/service-${svc}/"; then
                SPRING_CHANGED="$SPRING_CHANGED $svc"
              fi
            done
            SPRING_CHANGED=$(echo $SPRING_CHANGED)

            if echo "$CHANGED_FILES" | grep -q "^services/service-notification/"; then
              NOTIFICATION="true"
            else
              NOTIFICATION="false"
            fi
          fi

          if [ -n "$SPRING_CHANGED" ]; then
            JSON=$(echo "$SPRING_CHANGED" | tr ' ' '\n' | jq -R . | jq -sc .)
          else
            JSON="[]"
          fi

          echo "Changed spring services: ${SPRING_CHANGED:-none}"
          echo "Notification changed: $NOTIFICATION"

          echo "spring_services=$JSON" >> "$GITHUB_OUTPUT"
          echo "deploy_services=$SPRING_CHANGED" >> "$GITHUB_OUTPUT"
          echo "notification=$NOTIFICATION" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.spring_services != '[]' || needs.detect.outputs.notification == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build Spring services
        run: chmod +x gradlew && ./gradlew build -x test --no-daemon

      - name: Rename JARs
        run: |
          for service in $SPRING_SERVICES; do
            dir="services/service-${service}/build/libs"
            jar=$(find "$dir" -name "service-${service}-*.jar" ! -name "*-plain.jar" | head -1)
            if [ -n "$jar" ]; then
              cp "$jar" "$dir/service-${service}.jar"
            fi
          done

      - name: Upload Spring JARs
        uses: actions/upload-artifact@v4
        with:
          name: spring-jars
          retention-days: 1
          path: |
            services/*/build/libs/service-*.jar
            !services/*/build/libs/*-plain.jar

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Node service
        working-directory: services/service-notification
        run: npm ci && npm run build

      - name: Upload Node build
        uses: actions/upload-artifact@v4
        with:
          name: node-builds
          retention-days: 1
          path: services/service-notification/

  push:
    needs: [detect, build]
    if: needs.detect.outputs.spring_services != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 3
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.spring_services) }}
    steps:
      - name: Checkout (for Dockerfile)
        uses: actions/checkout@v4
        with:
          sparse-checkout: builds/develop

      - name: Download JARs
        uses: actions/download-artifact@v4
        with:
          name: spring-jars
          path: services/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Resolve Dockerfile
        id: dockerfile
        run: |
          if [ -f "builds/develop/Dockerfile.${{ matrix.service }}" ]; then
            echo "file=builds/develop/Dockerfile.${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          else
            echo "file=builds/develop/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: services/service-${{ matrix.service }}/build/libs
          file: ${{ steps.dockerfile.outputs.file }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:prod
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ steps.version.outputs.tag }}
          build-args: JAR_FILE=service-${{ matrix.service }}.jar

  push-node:
    needs: [detect, build]
    if: needs.detect.outputs.notification == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: node-builds
          path: services/service-notification/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: services/service-notification
          file: services/service-notification/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-notification:prod
            ${{ env.IMAGE_PREFIX }}-notification:${{ steps.version.outputs.tag }}

  deploy:
    needs: [detect, push, push-node]
    if: |
      always() &&
      needs.push.result != 'failure' && needs.push.result != 'cancelled' &&
      needs.push-node.result != 'failure' && needs.push-node.result != 'cancelled' &&
      (needs.detect.outputs.deploy_services != '' || needs.detect.outputs.notification == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Sequential rolling update
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.K3S_CONTROL_PLANE_HOST }}
          username: ${{ secrets.K3S_CONTROL_PLANE_USER }}
          key: ${{ secrets.K3S_CONTROL_PLANE_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            TAG=${{ steps.version.outputs.tag }}
            PREFIX=teamb1nd/dodam
            KC="sudo k3s kubectl"

            CHANGED="${{ needs.detect.outputs.deploy_services }}"
            if [ "${{ needs.detect.outputs.notification }}" = "true" ]; then
              CHANGED="$CHANGED notification"
            fi
            echo "배포 대상: $CHANGED"

            SERVICES="auth user neis nightstudy out-sleeping wakeup-song inapp notification file oauth gateway"
            for svc in $SERVICES; do
              case " $CHANGED " in
                *" $svc "*) ;;
                *) echo "⏭️  [$svc] 변경 없음, skip"; continue ;;
              esac

              # replicas=0 인 서비스는 이미지만 업데이트하고 rollout 건너뜀
              REPLICAS=$($KC get deployment/${svc} -n dodam -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "0")
              if [ "${REPLICAS}" = "0" ]; then
                echo "⏭️  [$svc] replicas=0, updating image only"
                $KC set image deployment/${svc} ${svc}=${PREFIX}-${svc}:${TAG} -n dodam 2>/dev/null || true
                continue
              fi

              echo "▶️  [$svc] updating to ${TAG}..."
              $KC set image deployment/${svc} ${svc}=${PREFIX}-${svc}:${TAG} -n dodam
              if $KC rollout status deployment/${svc} -n dodam --timeout=300s; then
                echo "✅ [$svc] ready"
              else
                echo "❌ [$svc] rollout FAILED"
                $KC get pods -n dodam -l app=${svc}
                $KC logs -n dodam -l app=${svc} --tail=50 2>/dev/null || true
                exit 1
              fi
            done

            echo "🎉 All services rolled out to ${TAG}"
